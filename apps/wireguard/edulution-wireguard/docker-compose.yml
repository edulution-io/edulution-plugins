services:
  edulution-wireguard:
    image: ghcr.io/edulution-io/edulution-wireguard:latest
    container_name: edulution-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # Lets edulution-wireguard route the networks behind satellites (sites)
      # on the host, so the linuxmuster server can answer their clients.
      - SYS_ADMIN
    restart: always
    volumes:
      - /srv/docker/edulution-ui/data/apps/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules
      - /proc/1/ns/net:/run/edulution/hostnet:ro
    environment:
      EDU_WG_IPNETWORK: <EDU_WG_IPNETWORK>
      EDU_WG_ADDRESS: <EDU_WG_ADDRESS>
      EDU_WG_API_KEY: ${EDU_WG_API_KEY}
      EDU_WG_DNS: <EDU_WG_DNS>
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - edulution-ui_default

networks:
  edulution-ui_default:
    external: true
