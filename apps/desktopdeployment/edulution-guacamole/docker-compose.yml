services:
  edulution-guacamoledb:
    container_name: edulution-guacamoledb
    image: ghcr.io/edulution-io/edulution-guacamole-db:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${EDULUTION_GUACAMOLE_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: "guacamole_db"
      MYSQL_USER: "guacamole_user"
      MYSQL_PASSWORD: ${EDULUTION_GUACAMOLE_MYSQL_PASSWORD}
      ADMIN_PASSWORD: ${EDULUTION_GUACAMOLE_ADMIN_PASSWORD}
    volumes:
      - guacdb-data:/var/lib/mysql

  edulution-guacd:
    container_name: edulution-guacd
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  edulution-guacamole:
    container_name: edulution-guacamole
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    environment:
      GUACD_HOSTNAME: "edulution-guacd"
      MYSQL_HOSTNAME: "edulution-guacamoledb"
      MYSQL_DATABASE: "guacamole_db"
      MYSQL_USER: "guacamole_user"
      MYSQL_PASSWORD: ${EDULUTION_GUACAMOLE_MYSQL_PASSWORD}
      TOTP_ENABLED: "false"
      QUICKCONNECT_ENABLED: "true"
      QUICKCONNECT_DENIED_PARAMETERS: "recording-path,recording-name,create-recording-path,recording-write-existing,recording-exclude-output,recording-exclude-mouse,recording-exclude-touch,recording-include-keys,typescript-path,typescript-name,create-typescript-path,typescript-write-existing,enable-drive,drive-name,drive-path,create-drive-path,enable-sftp,sftp-hostname,sftp-host-key,sftp-port,sftp-timeout,sftp-username,sftp-password,sftp-private-key,sftp-passphrase,sftp-public-key,sftp-directory,sftp-root-directory,sftp-server-alive-interval,sftp-disable-download,sftp-disable-upload,wol-send-packet,wol-mac-addr,wol-broadcast-addr,wol-udp-port,wol-wait-time,gateway-hostname,gateway-port,gateway-domain,gateway-username,gateway-password,dest-host,dest-port,reverse-connect,listen-timeout,audio-servername"
    depends_on:
      - edulution-guacamoledb
      - edulution-guacd
    volumes:
      - /srv/docker/edulution-ui/data/apps/desktopdeployment/edulution-guacamole/config:/home/guacamole

volumes:
  guacdb-data:

networks:
  edulution-ui_default:
