# version: v1.0
# updated: 2026-08-06T00:00:00Z

http:
  routers:
    docservice:
      rule: PathPrefix(`/docservice/`)
      service: docservice
      entryPoints:
        - websecure
      middlewares:
        - docservice-strip-prefix
        - docservice-add-headers
  services:
    docservice:
      loadBalancer:
        servers:
          - url: http://edulution-onlyoffice-documentserver
  middlewares:
    docservice-strip-prefix:
      stripPrefix:
        prefixes:
          - /docservice/
    docservice-add-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
