# version: v1.1
# updated: 2026-09-17T00:00:00Z

http:
  routers:
    collabora:
      rule: PathPrefix(`/collabora`)
      service: collabora
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - collabora-headers

  middlewares:
    collabora-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  services:
    collabora:
      loadBalancer:
        servers:
          - url: http://edulution-collabora:9980
        serversTransport: collabora-transport

  serversTransports:
    collabora-transport:
      forwardingTimeouts:
        dialTimeout: 30s
        responseHeaderTimeout: 0s
        idleConnTimeout: 0s
